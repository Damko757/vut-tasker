services:
  vt-web:
    container_name: vut-tasker-web
    build:
      context: ./
      dockerfile: ./web/Dockerfile
    ports:
      - "5000:80"
    volumes:
      - ./web/default.conf:/etc/nginx/conf.d/default.conf
    environment:
      - NGINX_PORT=80
    restart: unless-stopped
  vt-api:
    tty: true
    depends_on:
      - mongodb
    container_name: vut-tasker-api
    build:
      dockerfile: ./server/Dockerfile
      context: ./
    ports:
      - 3000:3000
    volumes:
      - ./server/traffic.log:/usr/src/app/traffic.log
      - ./server/src:/usr/src/app/src
      - ./shared:/usr/src/shared
    restart: unless-stopped
    environment:
      DATABASE_URI: mongodb
    env_file: .env
    networks:
      vt-internal: # for mongodb connection
  mongodb:
    container_name: vut-tasker-prod-mongodb
    image: mongo
    restart: unless-stopped
    ports:
      - 27017:27017
    volumes:
      - ./mongodb:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DATABASE_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${DATABASE_PASSWORD}
    networks:
      vt-internal:
networks:
  vt-internal:
    driver: bridge
